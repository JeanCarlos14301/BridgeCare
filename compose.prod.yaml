# Public CPU deployment overlay. Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Only Caddy publishes ports (80 for ACME and redirect, 443 for HTTPS). See docs/deploy.md.
services:
  api:
    ports: !reset []
    environment:
      APP_ENV: production
      ALLOW_UPLOADS: "false"
      CORS_ORIGINS: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (32+ characters)}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:?Set REVIEWER_PASSWORD (12+ characters)}

  web:
    ports: !reset []

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - web
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
