server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Behind an HTTPS edge (Cloudflare Tunnel, Caddy) a plain-HTTP request arrives with
    # X-Forwarded-Proto: http. Redirect it; local Docker requests carry no such header.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    # Security headers for every entry point (Caddy, Cloudflare Tunnel, local Docker).
    # Browsers ignore HSTS on plain-HTTP localhost.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Processing waits for the model: LLM_TIMEOUT_SECONDS (60) plus one retry.
        proxy_read_timeout 150s;
    }

    location / {
        try_files $uri /index.html;
    }
}
