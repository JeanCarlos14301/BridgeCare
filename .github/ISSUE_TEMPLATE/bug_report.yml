name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic or non-sensitive data only.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Environment and checks
      description: Include versions and commands, but no secrets or document content.
    validations:
      required: true

